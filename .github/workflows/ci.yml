name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version
          node --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  plugin:
    name: vite plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          node --version

      - name: Build the CLI the plugin drives
        run: cargo build -p cloudobfuscator-cli

      - name: Install the plugin dependencies
        working-directory: packages/vite-plugin-cloudobfuscator
        run: npm install --no-audit --no-fund

      - name: Test the plugin
        working-directory: packages/vite-plugin-cloudobfuscator
        run: npm test

  package:
    name: npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check what npm would publish
        working-directory: packages/vite-plugin-cloudobfuscator
        run: npm pack --dry-run

      - name: Pull the released binaries into the package
        working-directory: packages/vite-plugin-cloudobfuscator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-prebuilt.mjs --if-released --force

      - name: The tarball must carry every platform
        working-directory: packages/vite-plugin-cloudobfuscator
        run: |
          set -euo pipefail
          if [ ! -d prebuilt/linux-x64 ]; then
            echo "::notice::no release matches the package version yet, skipping the payload check"
            exit 0
          fi
          npm pack --dry-run --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [tarball] = JSON.parse(readFileSync("pack.json", "utf8"));
            const files = new Set(tarball.files.map((entry) => entry.path));
            const missing = [];
            for (const [platform, file] of [
              ["darwin-arm64", "cloudobfuscator"],
              ["darwin-x64", "cloudobfuscator"],
              ["linux-arm64", "cloudobfuscator"],
              ["linux-x64", "cloudobfuscator"],
              ["win32-x64", "cloudobfuscator.exe"],
            ]) {
              if (!files.has(`prebuilt/${platform}/${file}`)) {
                missing.push(platform);
              }
            }
            if (missing.length) {
              throw new Error(`the tarball is missing binaries for: ${missing.join(", ")}`);
            }
            console.log(`tarball carries all 5 platforms, ${(tarball.size / 1e6).toFixed(1)} MB`);
          '

      - name: The packaged binary runs on this host
        working-directory: packages/vite-plugin-cloudobfuscator
        run: |
          set -euo pipefail
          if [ ! -x prebuilt/linux-x64/cloudobfuscator ]; then
            echo "::notice::no release matches the package version yet, skipping the smoke test"
            exit 0
          fi
          ./prebuilt/linux-x64/cloudobfuscator --version
          echo 'const value = "the packaged binary still works";' > smoke.js
          ./prebuilt/linux-x64/cloudobfuscator smoke.js -o smoke.out.js --preset light --quiet
          ! grep -q "the packaged binary still works" smoke.out.js
          node --check smoke.out.js
