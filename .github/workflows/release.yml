name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish the archives for
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: cloudobfuscator (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: cloudobfuscator
            archive: cloudobfuscator-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: cloudobfuscator
            archive: cloudobfuscator-linux-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: cloudobfuscator
            archive: cloudobfuscator-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: cloudobfuscator
            archive: cloudobfuscator-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cloudobfuscator.exe
            archive: cloudobfuscator-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cross linker for linux aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set the linker for linux aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --locked -p cloudobfuscator-cli --target ${{ matrix.target }}

      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          ls -l dist

      - name: Archive as a zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath '${{ matrix.archive }}'

      - name: Archive as a tarball
        if: runner.os != 'Windows'
        run: tar -czf '${{ matrix.archive }}' -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: attach the archives
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" archives/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" archives/* --repo "$REPO" --generate-notes --title "$TAG"
          fi
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
